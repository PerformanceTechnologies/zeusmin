<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Zeus Mining - Sitio en construcción" />
  <title>Zeus Mining | Sitio en construcción</title>

  <style>
    :root {
      --gold: #dca700;
      --gold-light: #f0c43c;
      --dark: #05080c;
      --panel: rgba(12, 18, 25, 0.82);
      --text: #f4f7fa;
      --muted: #aeb8c2;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--dark);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      position: relative;
      background:
        radial-gradient(circle at 20% 20%, rgba(220, 167, 0, 0.13), transparent 34%),
        radial-gradient(circle at 80% 75%, rgba(52, 72, 89, 0.22), transparent 38%),
        linear-gradient(145deg, #020406 0%, #0a1017 52%, #020406 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.18;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    .container {
      width: min(92%, 860px);
      padding: 48px 28px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .card {
      padding: clamp(34px, 6vw, 64px);
      border: 1px solid rgba(220, 167, 0, 0.30);
      border-radius: 24px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.50),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .logo {
      display: block;
      width: min(100%, 580px);
      height: auto;
      margin: 0 auto 34px;
      filter: drop-shadow(0 16px 26px rgba(0, 0, 0, 0.45));
    }

    .line {
      width: 76px;
      height: 4px;
      margin: 0 auto 26px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      box-shadow: 0 0 18px rgba(220, 167, 0, 0.35);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.6rem);
      letter-spacing: -0.03em;
      line-height: 1.05;
      text-transform: uppercase;
    }

    p {
      margin: 18px auto 0;
      max-width: 560px;
      color: var(--muted);
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      line-height: 1.65;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 32px;
      padding: 11px 18px;
      border: 1px solid rgba(220, 167, 0, 0.28);
      border-radius: 999px;
      color: #e7eef5;
      background: rgba(220, 167, 0, 0.07);
      font-size: 0.92rem;
      letter-spacing: 0.04em;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--gold-light);
      box-shadow: 0 0 0 0 rgba(240, 196, 60, 0.65);
      animation: pulse 1.8s infinite;
    }

    footer {
      margin-top: 24px;
      color: #687581;
      font-size: 0.85rem;
    }

    @keyframes pulse {
      70% {
        box-shadow: 0 0 0 10px rgba(240, 196, 60, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(240, 196, 60, 0);
      }
    }

    @media (max-width: 520px) {
      .container {
        width: 95%;
        padding: 20px 10px;
      }

      .card {
        border-radius: 18px;
        padding: 32px 20px;
      }

      .logo {
        margin-bottom: 26px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="card">
      <img src="logo.png" alt="Logo de Zeus Mining" class="logo" />

      <div class="line"></div>

      <h1>Sitio en construcción</h1>

      <p>
        Estamos preparando nuestro nuevo sitio web.
        Muy pronto podrás conocer nuestros servicios y soluciones para la industria minera.
      </p>

      <div class="status">
        <span class="dot"></span>
        Próximamente en línea
      </div>
    </section>

    <footer>
      © <span id="year"></span> Zeus Mining. Todos los derechos reservados.
    </footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
